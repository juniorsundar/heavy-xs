[package]
name = "lite_xl_core"
# build.rs adds the git suffix outside release builds.
version = "2.1.7"
edition = "2021"
publish = false
build = "build.rs"

[lib]
name = "lite_xl_core"

[[bin]]
name = "lite-xl"
path = "src/main.rs"

# Linux only. Cargo builds Lua 5.4 (mlua vendored) and FreeType 2.13.2 (bundled),
# and links the system SDL3 via pkg-config.
[dependencies]
mlua = { version = "0.12", default-features = false, features = ["lua54", "vendored"] }
# Raw POSIX calls for the process module (fork/exec, pipes, waitpid, signals).
libc = "0.2"
sdl3-sys = { version = "0.7", default-features = false, features = ["use-pkg-config"] }
freetype-rs = { version = "0.38", features = ["bundled"] }
fancy-regex = "=0.19.2"

[features]
# Test-only synthetic event injection (rust/src/test_hooks.rs). Never enable in a shipping build.
test_hooks = []
# LITE_USE_SDL_RENDERER: the window draws into a texture through an SDL_Renderer instead of the
# window surface.
sdl_renderer = []

[profile.release]
panic = "abort"
lto = "thin"
# One unit keeps hot regex/mlua glue codegen stable across unrelated edits (measured ~2-10% faster).
codegen-units = 1
