[package]
name = "lite_xl_core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "lite_xl_core"
crate-type = ["staticlib"]

[dependencies]
# Lua itself comes from the C build, so `module` (no `vendored`).
mlua = { version = "0.12", features = ["lua54", "module"] }
# Raw POSIX calls for the process module (fork/exec, pipes, waitpid, signals).
libc = "0.2"
# Raw bindings only: C main.c still owns SDL init, the window and the event loop until W8,
# and Meson links SDL3 itself, so the crate must not link a second copy ("no-link").
sdl3-sys = { version = "0.7", default-features = false, features = ["no-link"] }
# Bindings only for W7: the final Meson link supplies its pinned FreeType 2.14.1.
# Do not enable bundled: the crate vendors 2.13.2, which changes hinted pixels.
freetype-rs = "0.38"

[features]
# Dev-only smoke module used to prove the C<->Rust link (see docs/rust-port/PLAN.md W0).
probe = []
# Test-only synthetic event injection (rust/src/test_hooks.rs). Never enable in a shipping build.
test_hooks = []
# LITE_USE_SDL_RENDERER: the window draws into a texture through an SDL_Renderer instead of the
# window surface (macOS uses this for retina displays; meson -Drenderer=true).
sdl_renderer = []

[profile.release]
panic = "abort"
lto = "thin"
