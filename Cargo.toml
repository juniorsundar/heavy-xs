[package]
name = "lite_xl_core"
# build.rs adds the git suffix outside release builds.
version = "2.1.7"
edition = "2021"
publish = false
build = "build.rs"

[lib]
name = "lite_xl_core"

[[bin]]
name = "lite-xl"
path = "src/main.rs"

# Linux only. Cargo builds Lua 5.4 (mlua vendored) and links the system SDL3 via
# pkg-config. Font parsing, hinting and rasterisation are Rust-native.
[dependencies]
mlua = { version = "0.12", default-features = false, features = ["lua54", "vendored"] }
# Raw POSIX calls for the process module (fork/exec, pipes, waitpid, signals).
libc = "0.2"
sdl3-sys = { version = "0.7", default-features = false, features = ["use-pkg-config"] }
fancy-regex = "=0.19.2"
skrifa = "=0.48.0"
zeno = "=0.3.3"
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd"] }
# Raw syscalls without libc: CLOCK_MONOTONIC_RAW for system.get_time and the zero-length sleep.
rustix = { version = "=1.1.5", default-features = false, features = ["time", "thread"] }
# Native plugins: dlopen/dlsym behind an owned handle (system.load_native_plugin).
libloading = "=0.8.9"
# Native platform cutover (SDL remains linked until the final packaging step).
winit = { version = "=0.30.13", features = ["wayland", "x11"] }
softbuffer = { git = "https://github.com/rust-windowing/softbuffer", rev = "9a7c9caf4ac29a8ae361d68c9a5babb97e36dc70", default-features = false, features = ["wayland", "wayland-dlopen", "x11", "x11-dlopen"] }
arboard = { version = "=3.7.0", default-features = false, features = ["wayland-data-control"] }
ashpd = { version = "=0.13.13", features = ["file_chooser", "raw_handle", "wayland"] }
tokio = { version = "=1.53.3", features = ["rt", "rt-multi-thread", "net", "time", "signal", "sync"] }

[features]
# Test-only synthetic event injection (src/test_hooks.rs). Never enable in a shipping build.
test_hooks = []

[profile.release]
panic = "abort"
lto = "thin"
# One unit keeps hot regex/mlua glue codegen stable across unrelated edits (measured ~2-10% faster).
codegen-units = 1
